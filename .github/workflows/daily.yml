name: 毎日ニュース動画生成・投稿

on:
  workflow_dispatch:        # 手動実行のみ

jobs:
  # ─────────────────────────────────────────
  # ジョブ1: 動画を生成して Artifact に保存
  # ─────────────────────────────────────────
  generate:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    services:
      voicevox:
        image: voicevox/voicevox_engine:cpu-ubuntu20.04-latest
        ports:
          - 50021:50021

    steps:
      - uses: actions/checkout@v4

      - name: Python セットアップ
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: FFmpeg インストール
        run: sudo apt-get install -y ffmpeg

      - name: 依存関係インストール
        run: pip install -r requirements.txt

      - name: VOICEVOX Engine 起動待機
        run: |
          echo "VOICEVOX Engine の起動を待機中..."
          for i in $(seq 1 30); do
            if curl -s http://localhost:50021/version > /dev/null; then
              echo "VOICEVOX Engine 起動完了"
              break
            fi
            echo "  待機中... (${i}/30)"
            sleep 5
          done

      - name: 動画生成
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          VOICEVOX_URL: http://localhost:50021
          VOICEVOX_SPEAKER: ${{ vars.VOICEVOX_SPEAKER || '3' }}
        run: python main.py generate

      - name: 動画を Artifact にアップロード
        uses: actions/upload-artifact@v4
        with:
          name: video-${{ github.run_id }}
          path: output/
          retention-days: 7

  # ─────────────────────────────────────────
  # ジョブ2: 承認後にSNSへ投稿
  # （GitHub の Environment "production" で承認者を設定すること）
  # ─────────────────────────────────────────
  publish:
    needs: generate
    runs-on: ubuntu-latest
    environment: production  # ← ここで承認待ちになる
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - uses: actions/checkout@v4

      - name: Python セットアップ
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 依存関係インストール
        run: pip install -r requirements.txt

      - name: Artifact をダウンロード
        uses: actions/download-artifact@v4
        with:
          name: video-${{ github.run_id }}
          path: output/

      - name: SNS投稿
        env:
          # YouTube
          YOUTUBE_ACCESS_TOKEN: ${{ secrets.YOUTUBE_ACCESS_TOKEN }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          # TikTok
          TIKTOK_ACCESS_TOKEN: ${{ secrets.TIKTOK_ACCESS_TOKEN }}
          # Instagram
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
          # Twitter/X
          TWITTER_API_KEY: ${{ secrets.TWITTER_API_KEY }}
          TWITTER_API_SECRET: ${{ secrets.TWITTER_API_SECRET }}
          TWITTER_ACCESS_TOKEN: ${{ secrets.TWITTER_ACCESS_TOKEN }}
          TWITTER_ACCESS_TOKEN_SECRET: ${{ secrets.TWITTER_ACCESS_TOKEN_SECRET }}
          # Facebook
          FACEBOOK_ACCESS_TOKEN: ${{ secrets.FACEBOOK_ACCESS_TOKEN }}
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
        run: python main.py publish
